name: Tests

on:
  push:
  pull_request:
  # ESPHome dev is unpinned: build weekly so upstream breakage shows up.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spec:
    name: Spec vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - name: Vectors verify
        run: python3 -I spec/tools/csframe.py verify spec/vectors
      - name: Vectors are up to date
        run: |
          python3 -I spec/tools/csframe.py vectors spec/vectors
          git diff --exit-code spec/vectors
      - name: Test transmitter frames match the vectors
        run: python3 -I tests/esphome/check_transmitter_frames.py
      - name: Frames match an independent AES-CCM and HKDF
        run: python3 -I tests/spec/test_independent_crypto.py

  proxy-core:
    name: Proxy core unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - run: make -C tests/proxy_core

  sensor-core:
    name: Sensor core unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - run: make -C tests/sensor_core

  devtools:
    name: Test server smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - run: python3 -I tests/devtools/test_testserver.py
      - run: python3 -I tests/devtools/test_pairing_code.py

  package:
    name: Python package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      # Builds the sdist and wheel, installs the wheel into a clean Python 3.13 venv
      # and runs the public API smoke test against it.
      - run: tests/package/check.sh dist
      - uses: actions/upload-artifact@v7
        with:
          name: connectsensors-dist
          path: dist/

  esphome-config:
    name: ESPHome dev config
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The component needs 2026.12 (asynchronous radio transmit); until it is
      # released, build against dev. Resolve it once so every job builds the
      # same commit.
      - name: Resolve ESPHome dev
        id: resolve
        run: |
          commit=$(git ls-remote https://github.com/esphome/esphome refs/heads/dev | cut -f1)
          test -n "$commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - run: pip install "esphome @ git+https://github.com/esphome/esphome@${{ steps.resolve.outputs.commit }}"
      - name: ESPHome version
        run: |
          esphome version
          python -c "import importlib.metadata as m, json; print('esphome commit:', json.loads(m.distribution('esphome').read_text('direct_url.json'))['vcs_info']['commit_id'])"
      - name: Validate
        run: |
          tests/esphome/prepare.sh build examples/*.yaml tests/esphome/proxy-sx127x.yaml
          for config in build/*.yaml; do
            [ "$(basename "$config")" = secrets.yaml ] && continue
            echo "::group::$config"
            esphome config "$config"
            echo "::endgroup::"
          done
      - name: Radio settings off the region profile are rejected
        run: tests/esphome/check_region_mismatch.sh

  esphome:
    name: ESPHome dev ${{ matrix.name }}
    needs: esphome-config
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: proxy-heltec-v3
            config: examples/proxy-heltec-v3.yaml
          - name: test-transmitter-heltec-v3
            config: examples/test-transmitter-heltec-v3.yaml
          - name: proxy-sx127x
            config: tests/esphome/proxy-sx127x.yaml
          - name: sensor-heltec-v3
            config: examples/sensor-heltec-v3.yaml
          - name: sensor-heltec-v3-deep-sleep
            config: examples/sensor-heltec-v3-deep-sleep.yaml
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "esphome @ git+https://github.com/esphome/esphome@${{ needs.esphome-config.outputs.commit }}"
      - name: ESPHome version
        run: |
          esphome version
          python -c "import importlib.metadata as m, json; print('esphome commit:', json.loads(m.distribution('esphome').read_text('direct_url.json'))['vcs_info']['commit_id'])"
      - name: Compile
        run: |
          tests/esphome/prepare.sh build ${{ matrix.config }}
          esphome compile build/$(basename ${{ matrix.config }})
