name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  spec:
    name: Spec vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - name: Vectors verify
        run: python3 -I spec/tools/csframe.py verify spec/vectors
      - name: Vectors are up to date
        run: |
          python3 -I spec/tools/csframe.py vectors spec/vectors
          git diff --exit-code spec/vectors

  proxy-core:
    name: Proxy core unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - run: make -C tests/proxy_core

  devtools:
    name: Test server smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - run: python3 -I tests/devtools/test_testserver.py

  esphome:
    name: ESPHome ${{ matrix.example }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [proxy-heltec-v3, test-transmitter-heltec-v3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install esphome==2026.11.0
      - name: Prepare config using this checkout
        run: |
          mkdir -p build
          sed "s#source: github://chrisuthe/ConnectSensors@main#source:\n      type: local\n      path: $GITHUB_WORKSPACE/components#" \
            examples/${{ matrix.example }}.yaml > build/test.yaml
          printf 'wifi_ssid: "ci"\nwifi_password: "ci-password"\ncs_proxy_key: "5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a5a"\n' > build/secrets.yaml
      - name: Validate
        run: esphome config build/test.yaml
      - name: Compile
        run: esphome compile build/test.yaml
