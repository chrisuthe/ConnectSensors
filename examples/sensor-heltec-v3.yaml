# ConnectSensors contact sensor on a Heltec WiFi LoRa 32 V3 (ESP32-S3 + SX1262),
# US915, mains (USB) powered. For battery operation see sensor-heltec-v3-deep-sleep.yaml.
#
# Needs secrets: wifi_ssid, wifi_password (Wi-Fi only carries logs and the
# diagnostic entities; the sensor itself talks LoRa), cs_dev_eui (16 hex digits)
# and cs_root_key (32 hex digits). Make a root key with `openssl rand -hex 16`.
# Print the pairing code with `devtools/cs_pairing_code.py --secrets secrets.yaml`
# and give it to the server, for example `devtools/cs_testserver.py --device CS:1:...`,
# then press PRG.
#
# Wiring: a reed switch between GPIO6 and GND (closed when the magnet is near,
# that is, when the door is shut). PRG (GPIO0) is the pairing button: a short
# press pairs, or while paired sends the state as a range test; holding it
# 10 seconds is a factory reset. Pins are from the board's published pinout;
# check them against your revision.

substitutions:
  name: lora-door

esphome:
  name: ${name}

esp32:
  board: heltec_wifi_lora_32_V3
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
  level: DEBUG
  # The S3 defaults to its native USB, but this board's USB socket is wired to
  # UART0 through a CP2102.
  hardware_uart: UART0

api:
  reboot_timeout: 0s

ota:
  - platform: esphome

external_components:
  - source: github://chrisuthe/ConnectSensors@main
    components: [cs_sensor]

spi:
  clk_pin: GPIO9
  mosi_pin: GPIO10
  miso_pin: GPIO11

sx126x:
  id: lora
  hw_version: sx1262
  cs_pin: GPIO8
  rst_pin: GPIO12
  busy_pin: GPIO13
  dio1_pin: GPIO14
  rf_switch: true
  tcxo_voltage: 1_8V
  tcxo_delay: 5ms
  modulation: LORA
  frequency: 918.5MHz
  bandwidth: 500_0kHz
  spreading_factor: 9
  coding_rate: CR_4_5
  preamble_size: 8
  sync_value: [0x14, 0x24]
  crc_enable: true
  pa_power: 20
  # Required by the region check; cs_sensor keeps the radio asleep outside its
  # RX windows, so it does not listen all the time.
  rx_start: true

binary_sensor:
  - platform: gpio
    id: door
    name: "Door"
    device_class: door
    pin:
      number: GPIO6
      mode:
        input: true
        pullup: true
    filters:
      # 08 section 4.1: debounce, 50 ms for a reed switch.
      - delayed_on_off: 50ms
  - platform: gpio
    id: pair_button
    name: "Pairing button"
    pin:
      number: GPIO0
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on_off: 20ms

cs_sensor:
  id: cs
  radio_id: lora
  region: US915
  dev_eui: !secret cs_dev_eui
  root_key: !secret cs_root_key
  heartbeat: 30min
  firmware_version: "0.1.0"
  pairing_button: pair_button
  readings:
    - channel: 0
      kind: contact
      binary_sensor: door
      confirmed: true

sensor:
  - platform: cs_sensor
    uplink_counter:
      name: "LoRa uplink counter"
    undelivered:
      name: "LoRa undelivered uplinks"
    last_rssi:
      name: "LoRa last downlink RSSI"
    last_snr:
      name: "LoRa last downlink SNR"

text_sensor:
  - platform: cs_sensor
    pairing_state:
      name: "LoRa pairing state"
