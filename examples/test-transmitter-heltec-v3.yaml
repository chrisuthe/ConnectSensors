# Test transmitter for proxy development, on a second Heltec WiFi LoRa 32 V3.
#
# Plain ESPHome, no ConnectSensors code: each button transmits one frame from
# spec/vectors/frame-v1.json, so a proxy can be tested before sensor firmware
# exists. The frames are fixed, so a real server would treat repeats as
# replays; devtools/cs_testserver.py accepts them for testing.
#
# The buttons are API buttons (Home Assistant or the ESPHome dashboard). The
# board's OLED shows the last frame sent and the last one heard, so a proxy's
# downlink shows up on the board without a serial console.
#
# For the bench runner (devtools/bench), the API action send_hex transmits any
# bytes, and two text sensors time each transmission and reception in micros():
#   TX timing: "<n> <tx_done_us> <len> ok|fail"
#   RX timing: "<n> <rx_us> <rssi> <snr> <hex>"
# tx_done_us is taken when the radio reports TX done (send_packet blocks until
# then); rx_us when on_packet runs, which is the loop pass after RX done. The
# host's on-air offset of a downlink is rx_us - tx_done_us - downlink airtime;
# devtools/bench/README.md has the method and its uncertainty.

substitutions:
  name: lora-test-tx

esphome:
  name: ${name}
  on_boot:
    priority: -100
    then:
      - script.execute: screen_wake

esp32:
  board: heltec_wifi_lora_32_V3
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
  # The S3 defaults to its native USB, but this board's USB socket is wired to
  # UART0 through a CP2102.
  hardware_uart: UART0

api:
  actions:
    # Transmit any frame, given as hex: devtools/bench sends fresh frames with it.
    - action: send_hex
      variables:
        data: string
      then:
        - script.execute:
            id: transmit
            hex: !lambda return data.str();
            what: "send_hex"

ota:
  - platform: esphome

spi:
  clk_pin: GPIO9
  mosi_pin: GPIO10
  miso_pin: GPIO11

sx126x:
  id: lora
  hw_version: sx1262
  cs_pin: GPIO8
  rst_pin: GPIO12
  busy_pin: GPIO13
  dio1_pin: GPIO14
  rf_switch: true
  tcxo_voltage: 1_8V
  tcxo_delay: 5ms
  modulation: LORA
  frequency: 918.5MHz
  bandwidth: 500_0kHz
  spreading_factor: 9
  coding_rate: CR_4_5
  preamble_size: 8
  sync_value: [0x14, 0x24]
  crc_enable: true
  pa_power: 2  # low power is plenty on a desk
  rx_start: true
  on_packet:
    then:
      - lambda: |-
          // First, before anything that takes time: the loop pass after RX done.
          const uint32_t at = micros();
          char hex[2 * 255 + 1];
          ESP_LOGI("test_tx", "heard %u bytes rssi %.1f snr %.1f: %s", (unsigned) x.size(), rssi, snr,
                   format_hex_to(hex, x));
          static const char *const types[16] = {"?", "DATA", "DATA_CONF", "HEARTBEAT", "HB_CONF", "JOIN",
                                                "SYNC", "?", "DOWNLINK"};
          const char *t = x.size() >= 2 && x[0] == 0xC5 ? types[x[1] & 0x0F] : nullptr;
          id(rx_count) += 1;
          id(rx_last) = t != nullptr && t[0] != '?' ? t : "non-CS";
          id(rx_rssi) = rssi;
          id(rx_snr) = snr;
          id(rx_timing).publish_state(str_sprintf("%d %" PRIu32 " %.1f %.1f %s", id(rx_count), at, rssi, snr, hex));
      - script.execute: screen_wake

button:
  - platform: template
    name: "Send DATA_CONFIRMED (door open)"
    on_press:
      - script.execute:
          id: transmit
          hex: "c512b08e8a4367a5b5ba00000003787421e72a60f966573f9cdb"
          what: "DATA_CONF"
  - platform: template
    name: "Send HEARTBEAT"
    on_press:
      - script.execute:
          id: transmit
          hex: "c513b08e8a4367a5b5ba00000004bba7002d94c1c3960a5fa51855c19a"
          what: "HEARTBEAT"
  - platform: template
    name: "Send JOIN"
    on_press:
      - script.execute:
          id: transmit
          hex: "c515222b42cec0e14ae700000001fda8f887c89ecaf10686a841d3c606aed6339a169ce07fa74501e9c6eab012cbfc7b749c1e82380318"
          what: "JOIN"
  - platform: template
    name: "Send a downlink frame (proxy must ignore)"
    on_press:
      - script.execute:
          id: transmit
          hex: "c518b08e8a4367a5b5ba000000026ffd6957eed987af597d329c7f52e5e4be"
          what: "DOWNLINK"
  - platform: template
    name: "Send a non-ConnectSensors packet (proxy must ignore)"
    on_press:
      - script.execute:
          id: transmit
          hex: "0102030405060708090a0b0c0d0e0f101112131415161718"
          what: "non-CS"

# --- Status screen: SSD1306 128x64 on the board, as on the proxy ---

binary_sensor:
  - platform: gpio
    name: "PRG button"
    pin:
      number: GPIO0
      inverted: true
      mode:
        input: true
        pullup: true
    on_press:
      - script.execute: screen_wake

text_sensor:
  - platform: wifi_info
    ip_address:
      id: ip_addr
  - platform: template
    id: tx_timing
    name: "TX timing"
    update_interval: never
  - platform: template
    id: rx_timing
    name: "RX timing"
    update_interval: never

# Vext (active low) powers the OLED and its I2C pull-ups, so it must come up
# before the I2C bus (priority 1000) or the bus scan sees SCL held low.
switch:
  - platform: gpio
    id: vext
    pin: GPIO36
    inverted: true
    restore_mode: ALWAYS_ON
    internal: true
    setup_priority: 1100

i2c:
  id: oled_bus
  sda: GPIO17
  scl: GPIO18
  frequency: 800kHz

font:
  - file: "gfonts://Roboto Mono"
    id: small
    size: 10

globals:
  - id: tx_count
    type: int
  - id: tx_done_us
    type: uint32_t
  - id: tx_last
    type: std::string
    initial_value: '"nothing yet"'
  - id: rx_count
    type: int
  - id: rx_last
    type: std::string
    initial_value: '"nothing yet"'
  - id: rx_rssi
    type: float
  - id: rx_snr
    type: float
  - id: screen_lines
    type: std::vector<std::string>

script:
  # Every transmission goes through here, so each one is timed the same way.
  - id: transmit
    parameters:
      hex: string
      what: string
    then:
      - lambda: |-
          const size_t len = hex.size() / 2;
          uint8_t frame[255];
          if (hex.size() % 2 != 0 || len == 0 || len > sizeof(frame) || !parse_hex(hex, frame, len)) {
            ESP_LOGW("test_tx", "%s: expected 2 to 510 hex digits", what.c_str());
            return;
          }
          const bool ok = id(lora).transmit_packet(frame, len) == sx126x::SX126xError::SX126X_ERROR_NONE;
          const uint32_t done = micros();  // transmit_packet returns at TX done
          id(tx_count) += 1;
          id(tx_done_us) = done;
          id(tx_last) = what;
          id(tx_timing).publish_state(
              str_sprintf("%d %" PRIu32 " %u %s", id(tx_count), done, (unsigned) len, ok ? "ok" : "fail"));
          ESP_LOGI("test_tx", "sent %s, %u bytes: %s", what.c_str(), (unsigned) len, ok ? "ok" : "failed");
      - script.execute: screen_wake
  # Sleeps after 10 minutes so a forgotten bench board does not burn in; any
  # send, any packet heard, or PRG wakes it.
  - id: screen_wake
    mode: restart
    then:
      - lambda: |-
          id(oled).turn_on();
          id(screen_lines).clear();  // force a redraw on the next check
      - delay: 10min
      - lambda: id(oled).turn_off();

interval:
  - interval: 1s
    then:
      - lambda: |-
          if (!id(oled).is_on())
            return;
          // A redraw holds the loop for milliseconds, which would delay on_packet and
          // skew the timing of a downlink; skip it while RX1 and RX2 may be arriving.
          if (id(tx_count) > 0 && micros() - id(tx_done_us) < 3500000)
            return;
          std::vector<std::string> lines{
              "test tx",
              str_sprintf("tx %d rx %d", id(tx_count), id(rx_count)),
              "sent " + id(tx_last),
              "heard " + id(rx_last),
              id(rx_count) > 0 ? str_sprintf("rssi %.0f snr %.1f", id(rx_rssi), id(rx_snr)) : "",
              id(ip_addr).state.empty() ? "WiFi connecting" : id(ip_addr).state,
          };
          if (lines != id(screen_lines)) {
            id(screen_lines) = std::move(lines);
            id(oled).update();
          }

display:
  - platform: ssd1306_i2c
    id: oled
    i2c_id: oled_bus
    model: SSD1306_128X64
    address: 0x3C
    reset_pin: GPIO21
    update_interval: never
    lambda: |-
      const auto &l = id(screen_lines);
      if (l.size() != 6)
        return;
      // Font is 13 px tall: five 13 px rows fill the 64 px screen.
      it.print(0, 0, id(small), l[0].c_str());
      it.print(127, 0, id(small), TextAlign::TOP_RIGHT, l[1].c_str());
      static const int row_y[] = {13, 26, 39, 51};
      for (int i = 0; i < 4; i++)
        it.print(0, row_y[i], id(small), l[i + 2].c_str());
