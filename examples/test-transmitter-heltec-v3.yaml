# Test transmitter for proxy development, on a second Heltec WiFi LoRa 32 V3.
#
# Plain ESPHome, no ConnectSensors code: each button transmits one frame from
# spec/vectors/frame-v1.json, so a proxy can be tested before sensor firmware
# exists. The frames are fixed, so a real server would treat repeats as
# replays; devtools/cs_testserver.py accepts them for testing.

substitutions:
  name: lora-test-tx

esphome:
  name: ${name}

esp32:
  board: heltec_wifi_lora_32_V3
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:

api:

ota:
  - platform: esphome

spi:
  clk_pin: GPIO9
  mosi_pin: GPIO10
  miso_pin: GPIO11

sx126x:
  id: lora
  hw_version: sx1262
  cs_pin: GPIO8
  rst_pin: GPIO12
  busy_pin: GPIO13
  dio1_pin: GPIO14
  rf_switch: true
  tcxo_voltage: 1_8V
  tcxo_delay: 5ms
  modulation: LORA
  frequency: 918.5MHz
  bandwidth: 500_0kHz
  spreading_factor: 9
  coding_rate: CR_4_5
  preamble_size: 8
  sync_value: [0x14, 0x24]
  crc_enable: true
  pa_power: 2  # low power is plenty on a desk
  rx_start: true
  on_packet:
    then:
      - lambda: |-
          char hex[2 * 255 + 1];
          ESP_LOGI("test_tx", "heard %u bytes rssi %.1f snr %.1f: %s", (unsigned) x.size(), rssi, snr,
                   format_hex_to(hex, x));

button:
  - platform: template
    name: "Send DATA_CONFIRMED (door open)"
    on_press:
      - sx126x.send_packet:
          data: [0xC5, 0x12, 0x61, 0xD3, 0x06, 0xD3, 0x45, 0x22, 0x68, 0xF4, 0x00, 0x00, 0x00, 0x03, 0x78, 0x74, 0x21, 0xE7, 0x51, 0xD0, 0xF9, 0xC8, 0xEE, 0x50, 0xDA, 0x1E]
  - platform: template
    name: "Send HEARTBEAT"
    on_press:
      - sx126x.send_packet:
          data: [0xC5, 0x13, 0x61, 0xD3, 0x06, 0xD3, 0x45, 0x22, 0x68, 0xF4, 0x00, 0x00, 0x00, 0x04, 0xBB, 0xA7, 0x00, 0x2D, 0x94, 0xC1, 0xC3, 0x91, 0x40, 0x83, 0x57, 0xC8, 0x3B, 0xF8, 0xE7]
  - platform: template
    name: "Send JOIN"
    on_press:
      - sx126x.send_packet:
          data: [0xC5, 0x15, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x01, 0xFD, 0xA8, 0xF8, 0x87, 0xC8, 0x9E, 0xCA, 0xF1, 0x06, 0x86, 0xA8, 0x41, 0xD3, 0xC6, 0x06, 0xAE, 0xD6, 0x33, 0x9A, 0x16, 0x9C, 0xE0, 0x7F, 0xA7, 0x45, 0x01, 0xE9, 0xC6, 0xEA, 0xB0, 0x12, 0xCB, 0xFC, 0x35, 0xD4, 0x35, 0xB8, 0x26, 0x8B, 0xDA, 0x9A]
  - platform: template
    name: "Send a downlink frame (proxy must ignore)"
    on_press:
      - sx126x.send_packet:
          data: [0xC5, 0x18, 0x61, 0xD3, 0x06, 0xD3, 0x45, 0x22, 0x68, 0xF4, 0x00, 0x00, 0x00, 0x03, 0x93, 0xA3, 0x14, 0x84, 0x22, 0x35, 0x43, 0x07, 0x15, 0x37, 0x98, 0x7E, 0xBB, 0x0D, 0x76, 0x1C, 0x59]
  - platform: template
    name: "Send a non-ConnectSensors packet (proxy must ignore)"
    on_press:
      - sx126x.send_packet:
          data: [0x01, 0x02, 0x03, 0x04, 0x05, 0x06, 0x07, 0x08, 0x09, 0x0A, 0x0B, 0x0C, 0x0D, 0x0E, 0x0F, 0x10, 0x11, 0x12, 0x13, 0x14, 0x15, 0x16, 0x17, 0x18]
